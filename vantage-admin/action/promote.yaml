# yaml-language-server: $schema=./action-schema-1.json
kind: terminal
description: |
  Copies what ${row.env} runs into ${row.next_env}: the exact image digest and
  the commit its terraform is pinned to, together, so the target can only ever
  run a pair ${row.env} actually ran. Nothing is committed to git — both are
  stack variables, and Spacelift deploys on the spot.

  appctl re-checks that ${row.env} is healthy and that its last run finished
  before writing anything, so this refuses on its own if the source stopped
  being good since the menu opened.
dialog:
  title: "Promote ${row.app} ${row.version}: ${row.env} to ${row.next_env}"
  confirm_label: Promote
terminal:
  command: ./cli/appctl
  args:
    - promote
    - --app
    - "${row.app}"
    - --from
    - "${row.env}"
    - --to
    - "${row.next_env}"
  cwd: /Users/rw/Work/spacelift-ui
