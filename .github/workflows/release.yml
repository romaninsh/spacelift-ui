name: release

# Landing a version change on main releases that component and moves dev onto
# it. Two independent axes: a service release changes which image dev runs, an
# infra release changes which commit dev's stacks are pinned to. Neither
# touches the other, and neither touches any environment above dev.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: Component to release
        required: true
        type: choice
        options: [api, frontend, base]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  REGISTRY: europe-west2-docker.pkg.dev
  PROJECT: inlaid-agility-461020-e4
  WORKLOAD_IDENTITY_PROVIDER: projects/129027965449/locations/global/workloadIdentityPools/github/providers/github
  SERVICE_ACCOUNT: github-actions@inlaid-agility-461020-e4.iam.gserviceaccount.com

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.changed.outputs.releases }}
      infra: ${{ steps.changed.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Which components changed version
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ inputs.component }}
        run: |
          set -euo pipefail

          before="$BEFORE"
          if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            before=$(git rev-parse HEAD~1)
          fi

          # Prints the version only if it moved — or always, when forced.
          bumped() {
            now=$(.github/component.sh version "$1")
            if [ -n "${FORCED:-}" ]; then echo "$now"; return; fi
            was=$(.github/component.sh version "$1" "$before" || true)
            [ "$now" = "$was" ] || echo "$now"
          }

          releases='[]'
          infra=''
          for component in ${FORCED:-api frontend base}; do
            version=$(bumped "$component")
            [ -n "$version" ] || continue
            echo "$component: $version"

            if [ "$component" = base ]; then
              infra="$version"
            else
              releases=$(jq -c --arg c "$component" --arg v "$version" \
                '. + [{component:$c,version:$v}]' <<<"$releases")
            fi
          done

          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"

  # Independent of the service releases: the two axes reach dev separately and
  # may briefly disagree there. Only promotion moves them as a pair, which is
  # what every environment above dev sees.
  infra:
    needs: detect
    if: needs.detect.outputs.infra != ''
    runs-on: ubuntu-latest
    env:
      TAG: base-${{ needs.detect.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Tag the released commit
        run: .github/tag.sh "$TAG" "$GITHUB_SHA"

      # Only after the tag exists, so dev is never pinned to a commit nobody
      # can name. BASE_VERSION carries that name, which is what promotion and
      # the dashboard read back.
      - name: Pin dev to it
        env:
          SPACELIFT_API_KEY_ENDPOINT: ${{ secrets.SPACELIFT_API_KEY_ENDPOINT }}
          SPACELIFT_API_KEY_ID: ${{ secrets.SPACELIFT_API_KEY_ID }}
          SPACELIFT_API_KEY_SECRET: ${{ secrets.SPACELIFT_API_KEY_SECRET }}
        run: |
          set -euo pipefail
          for component in api frontend; do
            spacectl stack set-current-commit --id "$component-dev" --sha "$GITHUB_SHA"
            spacectl stack environment setvar --id "$component-dev" BASE_VERSION "$TAG"
            spacectl stack deploy --id "$component-dev"
          done

  release:
    needs: detect
    if: needs.detect.outputs.releases != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.detect.outputs.releases) }}
    env:
      IMAGE: europe-west2-docker.pkg.dev/inlaid-agility-461020-e4/${{ matrix.component }}/${{ matrix.component }}
      TAG: ${{ matrix.component }}-${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        id: auth
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ${{ matrix.component }}
          push: true
          provenance: false
          build-args: |
            APP_VERSION=${{ env.TAG }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max,image-manifest=true,oci-mediatypes=true

      # Only once the artifact is really in the registry.
      - name: Tag the released commit
        run: .github/tag.sh "$TAG" "$GITHUB_SHA"

      # Dev has its own stack, so CI cannot reach any other environment even by
      # accident. Promotion above dev is a human action.
      - name: Deploy to dev
        env:
          SPACELIFT_API_KEY_ENDPOINT: ${{ secrets.SPACELIFT_API_KEY_ENDPOINT }}
          SPACELIFT_API_KEY_ID: ${{ secrets.SPACELIFT_API_KEY_ID }}
          SPACELIFT_API_KEY_SECRET: ${{ secrets.SPACELIFT_API_KEY_SECRET }}
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"

          # The artifact moves; dev's feature flags are environment
          # configuration and survive the release that lands beside them.
          kept=$(spacectl api "{ stack(id:\"$COMPONENT-dev\") { config { id value } } }" |
            jq -r '.data.stack.config[]? | select(.id == "TF_VAR_deploy") | .value')
          document=$(jq -cn --argjson kept "${kept:-null}" --arg v "$TAG" --arg d "$DIGEST" \
            '{version: $v, digest: $d, features: ($kept.features // {})}')
          spacectl stack environment setvar --id "$COMPONENT-dev" TF_VAR_deploy "$document"
          spacectl stack deploy --id "$COMPONENT-dev"

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### $TAG"
            echo
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
