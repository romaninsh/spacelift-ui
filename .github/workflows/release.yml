name: release

# A tag names the component and its version: api-0.1.0, frontend-0.4.1.
on:
  push:
    tags:
      - 'api-*'
      - 'frontend-*'

permissions:
  contents: write
  id-token: write

env:
  REGISTRY: europe-west2-docker.pkg.dev
  PROJECT: inlaid-agility-461020-e4
  # Both published by the base stack as outputs.
  WORKLOAD_IDENTITY_PROVIDER: projects/129027965449/locations/global/workloadIdentityPools/github/providers/github
  SERVICE_ACCOUNT: github-actions@inlaid-agility-461020-e4.iam.gserviceaccount.com

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.tag.outputs.component }}
      version: ${{ steps.tag.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^(api|frontend)-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::tag '$TAG' must be <component>-<major>.<minor>.<patch>"
            exit 1
          fi
          echo "component=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Both services report a version compiled into the artifact, so a tag that
      # disagrees with the manifest would ship a build claiming to be something
      # that was never released.
      - name: Tag must match the manifest
        env:
          COMPONENT: ${{ steps.tag.outputs.component }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if [ "$COMPONENT" = "api" ]; then
            declared=$(sed -n 's/^version = "\(.*\)"/\1/p' api/Cargo.toml | head -1)
          else
            declared=$(node -p "require('./frontend/package.json').version")
          fi
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::tag says $VERSION but $COMPONENT declares $declared"
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ steps.tag.outputs.component }}
          push: true
          provenance: false
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ steps.tag.outputs.component }}/${{ steps.tag.outputs.component }}:${{ steps.tag.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ steps.tag.outputs.component }}/${{ steps.tag.outputs.component }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Dev is always the newest build, with no human in the loop. Every environment
  # above it receives this same digest by explicit promotion.
  promote-dev:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Pin the digest for dev
        env:
          COMPONENT: ${{ needs.build.outputs.component }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          yq -i ".dev.version = \"$TAG\" | .dev.digest = \"$DIGEST\"" \
            "infra/app/deployments/${COMPONENT}.yaml"
          git diff --exit-code && echo "no change" && exit 0 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "$COMPONENT: deploy $TAG to dev"
          git push origin main
