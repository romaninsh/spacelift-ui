name: release

# Landing a version change on main builds that component and tags the commit.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: Component to release
        required: true
        type: choice
        options: [api, frontend]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  REGISTRY: europe-west2-docker.pkg.dev
  PROJECT: inlaid-agility-461020-e4
  WORKLOAD_IDENTITY_PROVIDER: projects/129027965449/locations/global/workloadIdentityPools/github/providers/github
  SERVICE_ACCOUNT: github-actions@inlaid-agility-461020-e4.iam.gserviceaccount.com

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.changed.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Which components changed version
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ inputs.component }}
        run: |
          set -euo pipefail

          api_version() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          frontend_version() { node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version"; }

          manifest() {
            case "$1" in
              api)      echo "api/Cargo.toml api_version" ;;
              frontend) echo "frontend/package.json frontend_version" ;;
            esac
          }

          before="$BEFORE"
          if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            before=$(git rev-parse HEAD~1)
          fi

          releases='[]'
          for component in ${FORCED:-api frontend}; do
            read -r path extract <<<"$(manifest "$component")"
            now=$("$extract" < "$path")

            if [ -n "$FORCED" ]; then
              echo "$component: forced release of $now"
            else
              was=$(git show "$before:$path" 2>/dev/null | "$extract" || true)
              [ "$now" = "$was" ] && continue
              echo "$component: $was -> $now"
            fi

            releases=$(echo "$releases" | jq -c --arg c "$component" --arg v "$now" '. + [{component:$c,version:$v}]')
          done

          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          echo "$releases"

  release:
    needs: detect
    if: needs.detect.outputs.releases != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.detect.outputs.releases) }}
    env:
      IMAGE: europe-west2-docker.pkg.dev/inlaid-agility-461020-e4/${{ matrix.component }}/${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        id: auth
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ${{ matrix.component }}
          push: true
          provenance: false
          build-args: |
            APP_VERSION=${{ matrix.component }}-${{ matrix.version }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max,image-manifest=true,oci-mediatypes=true

      # Only once the artifact is really in the registry.
      - name: Tag the released commit
        env:
          TAG: ${{ matrix.component }}-${{ matrix.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "${{ github.sha }}"
          git push origin "$TAG"

      # Dev has its own stack, so CI cannot reach any other environment even by
      # accident. Promotion above dev is a human action.
      - name: Deploy to dev
        env:
          SPACELIFT_API_KEY_ENDPOINT: ${{ secrets.SPACELIFT_API_KEY_ENDPOINT }}
          SPACELIFT_API_KEY_ID: ${{ secrets.SPACELIFT_API_KEY_ID }}
          SPACELIFT_API_KEY_SECRET: ${{ secrets.SPACELIFT_API_KEY_SECRET }}
          COMPONENT: ${{ matrix.component }}
          TAG: ${{ matrix.component }}-${{ matrix.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          document=$(jq -cn --arg v "$TAG" --arg d "$DIGEST" '{version:$v,digest:$d}')
          spacectl stack environment setvar --id "$COMPONENT-dev" TF_VAR_deploy "$document"
          spacectl stack deploy --id "$COMPONENT-dev"

      - name: Summary
        env:
          TAG: ${{ matrix.component }}-${{ matrix.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### $TAG"
            echo
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
