name: release

# Releases are driven by the manifest, not by a hand-made tag: land a version
# change on main and that component ships. Several can change in one push, and
# each is released independently.
on:
  push:
    branches: [main]
  # Escape hatch: release a component at whatever version main already
  # declares, for when the version landed before this workflow existed or a
  # run failed after the merge.
  workflow_dispatch:
    inputs:
      component:
        description: Component to release
        required: true
        type: choice
        options: [api, frontend]

permissions:
  contents: write
  id-token: write

# Each release commits back to main, so two overlapping runs would fight.
concurrency:
  group: release-main
  cancel-in-progress: false

env:
  REGISTRY: europe-west2-docker.pkg.dev
  PROJECT: inlaid-agility-461020-e4
  # Both published by the base stack as outputs.
  WORKLOAD_IDENTITY_PROVIDER: projects/129027965449/locations/global/workloadIdentityPools/github/providers/github
  SERVICE_ACCOUNT: github-actions@inlaid-agility-461020-e4.iam.gserviceaccount.com

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.changed.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Which components changed version
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ inputs.component }}
        run: |
          set -euo pipefail

          api_version() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          frontend_version() { node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version"; }

          manifest() {
            case "$1" in
              api)      echo "api/Cargo.toml api_version" ;;
              frontend) echo "frontend/package.json frontend_version" ;;
            esac
          }

          before="$BEFORE"
          if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            before=$(git rev-parse HEAD~1)
          fi

          releases='[]'
          for component in ${FORCED:-api frontend}; do
            read -r path extract <<<"$(manifest "$component")"
            now=$("$extract" < "$path")

            if [ -n "$FORCED" ]; then
              echo "$component: forced release of $now"
            else
              was=$(git show "$before:$path" 2>/dev/null | "$extract" || true)
              [ "$now" = "$was" ] && continue
              echo "$component: $was -> $now"
            fi

            releases=$(echo "$releases" | jq -c --arg c "$component" --arg v "$now" '. + [{component:$c,version:$v}]')
          done

          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          echo "$releases"

  release:
    needs: detect
    if: needs.detect.outputs.releases != '[]'
    runs-on: ubuntu-latest
    strategy:
      # Each job commits to main; serialise so they never race.
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.detect.outputs.releases) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.component }}
          push: true
          provenance: false
          build-args: |
            APP_VERSION=${{ matrix.component }}-${{ matrix.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ matrix.component }}/${{ matrix.component }}:${{ matrix.version }}
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ matrix.component }}/${{ matrix.component }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only once the artifact is really in the registry — the tag marks the
      # commit an image exists for, so it must not run ahead of the push.
      - name: Tag the released commit
        env:
          TAG: ${{ matrix.component }}-${{ matrix.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "${{ github.sha }}"
          git push origin "$TAG"

      - name: Install yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # Dev is always the newest build, with no human in the loop. Every
      # environment above it receives this same digest by explicit promotion.
      - name: Pin the digest for dev
        env:
          COMPONENT: ${{ matrix.component }}
          TAG: ${{ matrix.component }}-${{ matrix.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          yq -i ".dev.version = \"$TAG\" | .dev.digest = \"$DIGEST\"" \
            "infra/app/deployments/${COMPONENT}.yaml"
          if git diff --quiet; then
            echo "dev already pinned to $DIGEST"
            exit 0
          fi
          git commit -am "$COMPONENT: deploy $TAG to dev"
          git pull --rebase origin main
          git push origin HEAD:main
