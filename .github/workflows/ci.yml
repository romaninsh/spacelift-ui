name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Touched components must declare a new version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          failed=0
          for component in api frontend base; do
            git diff --quiet "$BASE"...HEAD -- $(.github/component.sh watch "$component") && continue

            now=$(.github/component.sh version "$component")
            was=$(.github/component.sh version "$component" "$BASE" || true)
            if [ "$now" = "$was" ]; then
              echo "::error::$component changed but still declares $now — bump it or the merge ships nothing"
              failed=1
            else
              echo "$component: $was -> $now"
            fi
          done
          exit $failed

  # One diff, reused by every build job, so a PR only runs the checks for what
  # it actually touched. Same watch paths the version gate uses.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.diff.outputs.api }}
      frontend: ${{ steps.diff.outputs.frontend }}
      base: ${{ steps.diff.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base=${BASE:-$(git rev-parse HEAD~1)}
          for component in api frontend base; do
            if git diff --quiet "$base"...HEAD -- $(.github/component.sh watch "$component"); then
              echo "$component=false" >> "$GITHUB_OUTPUT"
            else
              echo "$component=true" >> "$GITHUB_OUTPUT"
            fi
          done

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: api
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build

  infra:
    needs: changes
    if: needs.changes.outputs.base == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: tofu fmt -check -recursive infra
      - name: Validate each root
        run: |
          for root in infra/base infra/app; do
            tofu -chdir="$root" init -backend=false -input=false
            tofu -chdir="$root" validate
          done

  # The single check branch protection should require. Jobs above skip freely
  # when a PR does not touch them; a skip is not a pass, but a failure here is
  # a failure, so requiring this one cannot be satisfied by a job never running.
  conclude:
    needs: [version-bump, changes, api, frontend, infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
