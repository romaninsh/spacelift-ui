name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Touched components must declare a new version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          failed=0
          for component in api frontend base; do
            git diff --quiet "$BASE"...HEAD -- $(.github/component.sh watch "$component") && continue

            now=$(.github/component.sh version "$component")
            was=$(.github/component.sh version "$component" "$BASE" || true)
            if [ "$now" = "$was" ]; then
              echo "::error::$component changed but still declares $now — bump it or the merge ships nothing"
              failed=1
            else
              echo "$component: $was -> $now"
            fi
          done
          exit $failed

  # Terraform is only ever previewed against dev, the environment the merge
  # will land in. The plan runs in Spacelift — it owns the state — and tfcmt
  # patches one comment per stack instead of adding another on every push.
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Does this PR touch terraform
        id: touched
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE"...HEAD -- $(.github/component.sh watch base); then
            echo "infra=false" >> "$GITHUB_OUTPUT"
          else
            echo "infra=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan against dev
        if: steps.touched.outputs.infra == 'true'
        env:
          SPACELIFT_API_KEY_ENDPOINT: ${{ secrets.SPACELIFT_API_KEY_ENDPOINT }}
          SPACELIFT_API_KEY_ID: ${{ secrets.SPACELIFT_API_KEY_ID }}
          SPACELIFT_API_KEY_SECRET: ${{ secrets.SPACELIFT_API_KEY_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Both services share infra/app but differ by TF_VAR_component, so
          # each gets its own plan and its own comment to patch.
          for component in api frontend; do
            tfcmt --var "target:$component-dev" plan --patch -- \
              spacectl stack local-preview --id "$component-dev"
          done

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: api
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: tofu fmt -check -recursive infra
      - name: Validate each root
        run: |
          for root in infra/base infra/app; do
            tofu -chdir="$root" init -backend=false -input=false
            tofu -chdir="$root" validate
          done
