name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Touched components must declare a new version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          api_version() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          frontend_version() { node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version"; }

          failed=0
          for component in api frontend; do
            case "$component" in
              api)      path=api/Cargo.toml;        extract=api_version ;;
              frontend) path=frontend/package.json; extract=frontend_version ;;
            esac

            git diff --quiet "$BASE"...HEAD -- "$component" && continue

            now=$("$extract" < "$path")
            was=$(git show "$BASE:$path" | "$extract")
            if [ "$now" = "$was" ]; then
              echo "::error file=$path::$component changed but still declares $now — bump it or the merge ships nothing"
              failed=1
            else
              echo "$component: $was -> $now"
            fi
          done
          exit $failed

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: api
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: tofu fmt -check -recursive infra
      - name: Validate each root
        run: |
          for root in infra/base infra/app; do
            tofu -chdir="$root" init -backend=false -input=false
            tofu -chdir="$root" validate
          done
