# yaml-language-server: $schema=./page-schema-1.json
# Selecting an app shows that app's environments beneath it. This is a drill
# rather than a binder tab because `references:` is dropped for cmd tables —
# see vista_loader.rs, where the cmd branch passes an empty reference map.
title: Apps
body:
  - kind: grid
    name: apps
    observe: apps
    params:
      columns:
        title:
          label: Name
          width: 200
        kind:
          # Rendered as a tag inside the Name cell. Amber rather than blue,
          # which the Adventure Time theme already uses for chrome.
          label: Kind
          color:
            yellow: [service]
            muted: [infra]
        stack:
          label: Stack
          width: 160
          render: '`${row.key} (${row.stack})`'
        image:
          label: Image
          width: 320
        features:
          label: Feature flags
          width: 200
      default_sort: { column: title, direction: asc }

  - kind: grid
    name: app_deployments
    when: '${apps.selected_id} != ""'
    observe:
      script: |
        scenery("deployments").where("app", "${apps.selected_id}").sort("order", "asc")
    params:
      columns:
        order:
          label: "#"
          width: 50
        env:
          label: Environment
          width: 120
        version:
          label: Version
          width: 140
        status:
          label: Status
          width: 120
          color:
            success: [healthy]
            yellow: [deploying]
            red: [unhealthy]
            muted: [absent, not deployed]
        drift:
          label: Freshness
          width: 110
          color:
            success: [current]
            yellow: [behind]
            muted: [absent]
          labels:
            current: Newest
            behind: Behind
            absent: "—"
        color:
          label: Colour
          width: 90
          color:
            green: [green]
            blue: [blue]
            red: [red]
            muted: [gray]
        next_env:
          label: Promotes to
          width: 120
        url:
          label: URL
          width: 320
      default_sort: { column: order, direction: asc }
      row_actions:
        - label: "Promote to next environment"
          when: 'row.promotable'
          action: |
            actions.promote(row);
        - label: "Tail logs"
          when: 'row.url != ""'
          action: |
            actions.service_logs(row);
